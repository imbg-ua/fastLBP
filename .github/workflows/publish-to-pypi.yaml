name: Publish Python 🐍 distribution 📦 to PyPI and TestPyPI

on:
  push:
    # trigger on tags only
    # branches: [ "main" ]
    tags: [ "v*" ]

jobs:
  build:
    name: Build distribution 📦
    # if: startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ">=3.11"

    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@master
    
    - name: Verify nvcc installation
      run: nvcc --version

    - name: Install pypa/build and dependencies
      run: >-
        python3 -m
        pip install
        build numpy cython auditwheel
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Repair the wheel
      run: >-
        auditwheel repair dist/*whl 
    - name: Store the repaired wheel
      uses: actions/upload-artifact@v4
      with: 
        name: repaired-python-package-distributions
        path: wheelhouse/
      

  publish-to-testpypi:
    name: Publish to TestPyPI 📦
    if: ${{ contains(github.ref_name, 'DEBUG_placeholder_to_test_build_only') }}
    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/fastlbp

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: repaired-python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        verbose: true

  publish-to-pypi:
    name: Publish to PyPI 📦
    if: ${{ contains(github.ref_name, 'DEBUG_placeholder_to_test_build_only') }}
    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/fastlbp

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: repaired-python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/