name: Publish Python 🐍 distribution 📦 to PyPI and TestPyPI

on:
  push:
    # trigger on tags only
    # branches: [ "main" ]
    tags: ["v*"]

jobs:
  build:
    name: Build distribution 📦
    # if: startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@master
        with:
          method: "network"
          sub-packages: '["nvcc"]'

      - name: Verify nvcc installation
        run: nvcc --version

      - name: Install pypa/build and dependencies
        run: >-
          python3 -m
          pip install
          build numpy cython auditwheel
          --user

      - name: Build a binary wheel and a source tarball
        run: python3 -m build

      - name: Repair the wheel
        run: >-
          auditwheel repair dist/*whl

      - name: Store the repaired wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-py${{ matrix.python-version }}
          path: wheelhouse/*.whl

  publish-to-testpypi:
    name: Publish to TestPyPI 📦
    if: ${{ contains(github.ref_name, 'dev') || contains(github.ref_name, 'rc') }}
    needs:
      - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/fastlbp

    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: wheel-*
          merge_multiple: true

      - name: Verify built wheels
        run: ls -la dist/

      - name: Publish distribution 📦 to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true

  publish-to-pypi:
    name: Publish to PyPI 📦
    if: ${{ !contains(github.ref_name, 'dev') && !contains(github.ref_name, 'rc') }}
    needs:
      - build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/fastlbp

    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: wheel-*
          merge_multiple: true

      - name: Verify built wheels
        run: ls -la dist/

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
