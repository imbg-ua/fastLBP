name: Publish Python 🐍 distribution 📦 to PyPI and TestPyPI
# TODO: use cibuildwheel for multi-platform builds
on:
  push:
    # trigger on tags only
    # branches: [ "main" ]
    tags: ["v*"]

jobs:
  build:
    name: Build distribution 📦
    # if: startsWith(github.ref, 'refs/tags')
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # Target different Ubuntu versions for different GLIBC compatibility
        include:
          - os: ubuntu-22.04
            python-version: "3.11"
            cuda-version: "11.8.0"
          - os: ubuntu-22.04
            python-version: "3.12"
            cuda-version: "11.8.0"
          - os: ubuntu-22.04
            python-version: "3.13"
            cuda-version: "11.8.0"
          - os: ubuntu-24.04
            python-version: "3.11"
            cuda-version: "13.0.2"
          - os: ubuntu-24.04
            python-version: "3.12"
            cuda-version: "13.0.2"
          - os: ubuntu-24.04
            python-version: "3.13"
            cuda-version: "13.0.2"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@master
        with:
          cuda: ${{ matrix.cuda-version }}
          method: "network"
          sub-packages: '["nvcc"]'

      - name: Verify nvcc installation
        run: nvcc --version

      - name: Install pypa/build and dependencies
        run: >-
          python3 -m
          pip install
          build numpy cython auditwheel
          --user

      - name: Build a binary wheel and a source tarball
        run: python3 -m build

      - name: Repair the wheel
        run: >-
          auditwheel repair dist/*whl

      - name: Store the repaired wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: wheelhouse/*.whl

  publish-to-testpypi:
    name: Publish to TestPyPI 📦
    if: ${{ contains(github.ref_name, 'dev') || contains(github.ref_name, 'rc') }}
    needs:
      - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/fastlbp

    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: wheel-*
          merge-multiple: true

      - name: Flatten directory structure
        run: |
          # Create a clean dist directory
          mkdir -p clean_dist
          # Find and copy all .whl files to clean_dist
          find dist -name "*.whl" -exec cp {} clean_dist/ \;
          # Replace dist with clean_dist
          rm -rf dist
          mv clean_dist dist
          echo "Final distribution files:"
          ls -la dist/

      - name: Publish distribution 📦 to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true

  publish-to-pypi:
    name: Publish to PyPI 📦
    if: ${{ !contains(github.ref_name, 'dev') && !contains(github.ref_name, 'rc') }}
    needs:
      - build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/fastlbp

    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: wheel-*
          merge_multiple: true

      - name: Flatten directory structure
        run: |
          # Create a clean dist directory
          mkdir -p clean_dist
          # Find and copy all .whl files to clean_dist
          find dist -name "*.whl" -exec cp {} clean_dist/ \;
          # Replace dist with clean_dist
          rm -rf dist
          mv clean_dist dist
          echo "Final distribution files:"
          ls -la dist/

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
